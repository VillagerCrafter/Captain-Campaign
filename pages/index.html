---
layout: null
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1A2B49">
    <meta name="description" content="A custom page from Captain Campaign.">
    <title>Page | {{ site.title | escape }}</title>
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/pages/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Captain Campaign">
    <meta property="og:title" content="Page | {{ site.title | escape }}">
    <meta property="og:description" content="A custom page from Captain Campaign.">
    <meta property="og:image" content="{{ site.url }}{{ '/assets/images/captain-campaign-logo.png' | relative_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/site-content.js' | relative_url }}" data-content-url="{{ '/site-content.json' | relative_url }}" data-site-baseurl="{{ site.baseurl }}" defer></script>
    <script src="{{ '/assets/js/analytics-collector.js' | relative_url }}" defer></script>
  </head>
  <body class="custom-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand-mark" href="{{ '/' | relative_url }}" aria-label="Captain Campaign home">
        <img class="brand-logo" src="{{ '/assets/images/captain-campaign-logo.png' | relative_url }}" alt="Captain Campaign" width="160" height="56">
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
        <span class="menu-toggle-label">Menu</span>
        <span class="menu-toggle-icon" aria-hidden="true"></span>
      </button>
      <nav class="primary-navigation" id="primary-navigation" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/#services' | relative_url }}">Services</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#work' | relative_url }}">Portfolio</a>
        <a class="nav-cta" href="{{ '/#contact' | relative_url }}">Contact <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="main"></main>
    <footer class="site-footer">
      <div class="page-width footer-top">
        <div>
          <a class="footer-brand" href="{{ '/' | relative_url }}">
            <img class="brand-logo brand-logo-footer" src="{{ '/assets/images/captain-campaign-logo.png' | relative_url }}" alt="Captain Campaign" width="140" height="48">
            <span class="footer-byline">by Liam Bennicoff</span>
          </a>
          <p>Brand experiences with purpose, energy, and a human touch.</p>
        </div>
      </div>
      <div class="page-width footer-bottom"><span>© {{ 'now' | date: '%Y' }} Captain Campaign · Liam Bennicoff</span><a href="{{ '/' | relative_url }}">Back home ↑</a></div>
    </footer>
  </body>
</html>
